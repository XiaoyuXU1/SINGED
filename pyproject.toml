[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "singed-benchmark"
version = "0.1.0"
description = "Auditable evaluation of output-equivalent implementations with different process effects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Xiaoyu Xu"},
  {name = "Zi Liang"},
  {name = "Minxin Du"},
  {name = "Qipeng Xie"},
  {name = "Qingqing Ye"},
  {name = "Yuyuan Li"},
  {name = "Haibo Hu"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
singed = "singed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
